quarkus:
  datasource:
    username: bob
    password: bob
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/smartbarbo
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  # http:
  #   ssl:
  #     certificate:
  #       key-store-password: ""
  #       trust-store-password: ""
  #     client-auth: required
  #   insecure-requests: redirect
  oidc:
    auth-server-url: http://localhost:7070/realms/sbo
    client-id: smartbar-backoffice
    credentials:
      secret: ""
    application-type: hybrid
    token-state-manager:
      split-tokens: true
    roles:
      source: accesstoken
  kafka:
    devservices:
      enabled: false
    bootstrap:
      servers: localhost:9092
  mp:
    messaging:
      outgoing:
        menu-update-events:
          connector: smallrye-kafka
          topic: menu-update-events
          value:
            serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer

smartbar.backoffice.foo: baz
