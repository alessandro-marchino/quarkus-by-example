quarkus:
  datasource:
    username: bob
    password: bob
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/smartbarbo
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  # http:
  #   ssl:
  #     certificate:
  #       key-store-password: ""
  #       trust-store-password: ""
  #     client-auth: required
  #   insecure-requests: redirect
  oidc:
    auth-server-url: http://localhost:7070/realms/sbo
    client-id: smartbar-backoffice
    credentials:
      secret: ""
    application-type: hybrid
    token-state-manager:
      split-tokens: true
    roles:
      source: accesstoken
  kafka:
    devservices:
      enabled: false
  rabbitmq:
    devservices:
      enabled: false
  # mp:
  messaging:
    outgoing:
      menu-update-events:
        connector: smallrye-kafka
        topic: menu-update-events
        value:
          serialized: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
    incoming:
      order-placed-events:
        connector: smallrye-kafka
        topic: order-placed-events
        group:
          id: backoffice-article-updater
      turnover-db-channel:
        connector: smallrye-kafka
        topic: order-placed-events
        group:
          id: backoffice-turnover-updater

kafka:
  bootstrap:
    servers: localhost:9092

rabbitmq-host: localhost
rabbitmq-port: 5672
rabbitmq-username: ""
rabbitmq-password: ""

smartbar.backoffice.foo: baz
