quarkus:
  http:
    port: 8081
  management:
    port: 9001
  rest-client:
    de.schulte.smartbar.orderclient.login.MenuApiClient:
      url: ""
  cache:
    caffeine:
      expire-after-write: PT1M
  redis:
    hosts: redis://localhost:6379/0
    devservices:
      enabled: false
  mongodb:
    connection-string: mongodb://localhost:27017
  dynamodb:
    endpoint-override: http://localhost:8000
    aws:
      region: eu-central-1
      credentials:
        type: static
        static-provider:
          access-key-id: test
          secret-access-key: test
  kafka:
    devservices:
      enabled: false
    bootstrap:
      servers: localhost:9092
  mp:
    messaging:
      incoming:
        menu-update-events:
          connector: smallrye-kafka
          topic: menu-update-events
          value:
            serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer

smartbar:
  orderclient:
    login: default
