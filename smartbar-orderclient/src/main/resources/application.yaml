quarkus:
  http:
    port: 8081
  management:
    port: 9001
  rest-client:
    de.schulte.smartbar.orderclient.login.MenuApiClient:
      url: ""
  cache:
    caffeine:
      expire-after-write: PT1M
  redis:
    hosts: redis://localhost:6379/0
    devservices:
      enabled: false
  mongodb:
    connection-string: mongodb://localhost:27017
  dynamodb:
    endpoint-override: http://localhost:8000
    aws:
      region: eu-central-1
      credentials:
        type: static
        static-provider:
          access-key-id: test
          secret-access-key: test
  kafka:
    devservices:
      enabled: false
    bootstrap:
      servers: localhost:9092
  rabbitmq:
    devservices:
      enabled: false
  messaging:
    incoming:
      menu-update-events:
        connector: smallrye-rabbitmq
        default-routing-key: menuupdates
        queue:
          name: menuupdates

rabbitmq-host: localhost
rabbitmq-port: 5672
rabbitmq-username: ""
rabbitmq-password: ""

smartbar:
  orderclient:
    login: default
